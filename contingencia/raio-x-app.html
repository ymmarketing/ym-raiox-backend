<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Raio-X Digital — YM</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F7F9FC}#app{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;display:grid;place-items:center;background:#F7F9FC;font:14px Inter,Arial,sans-serif;color:#0A2540"><div style="background:#fff;border:1px solid #E4EAF2;border-radius:18px;padding:24px 28px;box-shadow:0 14px 40px rgba(10,37,64,.08);text-align:center"><b>Confirmando seu acesso…</b><div style="margin-top:7px;color:#6E7D92;font-size:12px">Isso leva apenas alguns segundos.</div></div></div>
<iframe id="app" title="Raio-X Digital YM" style="visibility:hidden"></iframe>
<script>
(()=>{
const frame=document.getElementById('app'),gate=document.getElementById('gate');
const q=new URLSearchParams(location.search),ref=q.get('ref')||'';
async function openWhenApproved(){if(!ref){gate.innerHTML='<div style=\"background:#fff;padding:24px;border-radius:16px\"><b>Acesso inválido.</b></div>';return;}for(let i=0;i<20;i++){try{const r=await fetch('https://ym-raiox-backend.vercel.app/api/pagamento/status?ref='+encodeURIComponent(ref),{cache:'no-store'});const d=await r.json();if(d&&d.status==='approved'){frame.src='/contingencia/raio-x-app-base.html'+location.search;frame.style.visibility='visible';gate.style.display='none';return;}}catch(e){}await new Promise(r=>setTimeout(r,i<4?700:1500));}gate.innerHTML='<div style=\"background:#fff;border:1px solid #E4EAF2;border-radius:18px;padding:24px 28px;text-align:center\"><b>Pagamento ainda em confirmação.</b><div style=\"margin-top:8px;color:#6E7D92;font-size:12px\">Atualize esta página em alguns instantes. Suas informações estão protegidas.</div></div>';}
openWhenApproved();
const CSS=`
.tag{display:none!important}.reportwrap{max-width:960px!important}.reportactions{justify-content:flex-end!important}.reporthero{position:relative;overflow:hidden;padding:42px!important}.reporthero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-110px;top:-120px;background:radial-gradient(circle,rgba(0,102,255,.12),rgba(0,102,255,0) 70%);pointer-events:none}.leadgrid{position:relative;grid-template-columns:minmax(0,1fr) 178px!important;gap:34px!important}.companyKicker{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#0066FF;margin-bottom:5px}.readyLine{font-size:12px;font-weight:700;color:#6E7D92;margin-bottom:13px}.reporthero h1{margin-top:0!important}.overall{--tone:#0066FF;--pct:50;border:0!important;background:none!important;padding:0!important;min-height:0!important;display:flex!important;flex-direction:column;align-items:center;justify-content:flex-start}.overallTitle{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:#6E7D92;text-align:center;line-height:1.3;margin-bottom:10px;max-width:150px}.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--tone) calc(var(--pct)*1%),#E9EEF5 0);display:grid;place-items:center;box-shadow:0 8px 24px rgba(10,37,64,.05)}.ringInner{width:122px;height:122px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(10,37,64,.035)}.ringInner strong{font:800 42px/.95 Montserrat,Arial;color:var(--tone)!important;letter-spacing:-.05em}.ringInner .den{font-size:12px;font-weight:700;color:#6E7D92;margin-left:4px}.overallBand{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--tone);margin-top:9px;text-align:center}.summarycards{gap:12px!important}.summarycards>div{position:relative;padding:17px 17px 17px 48px!important;min-height:112px}.summaryIcon{position:absolute;left:16px;top:16px;width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#EEF4FF;color:#0066FF;font-weight:800}.summarycards>div:nth-child(1) .summaryIcon{background:#EAF8F2;color:#067A55}.summarycards>div:nth-child(2) .summaryIcon{background:#FFF4E6;color:#B26500}
.scoregrid{grid-template-columns:repeat(3,1fr)!important;gap:12px!important}.scorecard{--tone:#0066FF;border-top:4px solid var(--tone)!important;background:#fff!important;min-height:176px;box-shadow:0 7px 22px rgba(10,37,64,.035)}.scorecard[data-tone=critical]{--tone:#B42318}.scorecard[data-tone=attention]{--tone:#D9821B}.scorecard[data-tone=good]{--tone:#0066FF}.scorecard[data-tone=strong]{--tone:#067A55}.scorehead{display:grid!important;grid-template-columns:32px 1fr auto;gap:8px;align-items:start}.scoreIcon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#F2F5FA;color:var(--tone);font-weight:800}.scorehead h3{max-width:none!important;font-size:13px!important}.scorevalue{color:var(--tone)!important}.track{height:8px!important}.track i{background:var(--tone)!important}.scoremeta{display:flex;justify-content:space-between;gap:8px;color:var(--tone)!important}.scorereason{line-height:1.48!important}.scorelegend{display:flex;flex-wrap:wrap;gap:8px 14px}.legendDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.legendDot.red{background:#B42318}.legendDot.amber{background:#D9821B}.legendDot.blue{background:#0066FF}.legendDot.green{background:#067A55}
.sectionIcon{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#EEF4FF;color:#0066FF;font-weight:800;margin-right:8px;vertical-align:middle}.connectionsGrid,.findingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.connectionsGrid .item,.findingsGrid .item{border:1px solid #E2E8F1!important;border-radius:14px;padding:16px!important;background:#fff}.connectionsGrid .item{border-top:1px solid #E2E8F1!important}.findingsGrid{grid-template-columns:1fr}.findingsGrid .item{border-left:5px solid #0066FF!important}.journey{position:relative;gap:9px!important}.journey:before{content:"";position:absolute;top:24px;left:7%;right:7%;height:2px;background:#E3EAF4;z-index:0}.j{position:relative;z-index:1;min-height:170px;text-align:center;padding-top:12px!important}.journeyIcon{width:46px;height:46px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:#fff;font-weight:800}.j[data-status=estruturado]{color:#067A55}.j[data-status=atencao]{color:#D9821B}.j[data-status=validar]{color:#3D47C4}.j b,.j p{color:#263B52!important}.j p{font-size:11px!important}.front,.prio,.phase{background:#fff!important}.prioritiesGrid{grid-template-columns:repeat(3,1fr)!important}.priorityNum{font:800 40px/1 Montserrat;color:#E7EEF8;margin-bottom:4px}.timeline .phase{position:relative}.phaseNum{font:800 32px/1 Montserrat;color:#DCE8FA;margin-bottom:7px}.closingDark{background:linear-gradient(135deg,#0A2540,#123E67)!important;color:#fff!important}.closingDark h2{color:#fff!important}.closingDark .eyebrow{color:#8EC5FF!important}.closingDark p,.closingDark .small{color:#DCE7F2!important}
@media(max-width:860px){.scoregrid{grid-template-columns:1fr 1fr!important}.prioritiesGrid{grid-template-columns:1fr 1fr!important}.journey{grid-template-columns:repeat(3,1fr)!important}.journey:before{display:none}}
@media(max-width:760px){.shell{padding-left:14px!important;padding-right:14px!important}.leadgrid{grid-template-columns:1fr!important}.overall{justify-self:center;margin-top:8px}.ring{width:132px;height:132px}.ringInner{width:106px;height:106px}.ringInner strong{font-size:36px}.summarycards,.scoregrid,.connectionsGrid,.findingsGrid,.grid2,.timeline,.prioritiesGrid{grid-template-columns:1fr!important}.journey{grid-template-columns:1fr 1fr!important}.reporthero,.rsec{padding:24px 19px!important}.reporthero h1{font-size:clamp(27px,8vw,38px)!important}.summarycards>div{min-height:0}.top{padding:0 14px!important}}
@media(max-width:460px){.journey{grid-template-columns:1fr!important}.brand span{font-size:11px}.reporthero{padding:21px 17px!important}.rsec{padding:22px 17px!important}}
@media print{@page{size:A4;margin:9mm 9mm 10mm}html,body{background:#fff!important;font-size:11.2pt!important}.top,.reportactions,.adminbox{display:none!important}.shell{width:auto!important;max-width:none!important;padding:0!important}.reportwrap{width:auto!important;max-width:none!important}.card{box-shadow:none!important;border-color:#DDE4ED!important;border-radius:10px!important}.reporthero{padding:9mm!important;break-inside:avoid}.leadgrid{grid-template-columns:minmax(0,1fr) 38mm!important;gap:7mm!important}.ring{width:34mm;height:34mm}.ringInner{width:27MM;height:27MM}.ringInner strong{font-size:25pt!important}.reporthero h1{font-size:23pt!important;line-height:1.08!important}.reading{font-size:11.5pt!important;line-height:1.48!important}.summarycards{grid-template-columns:repeat(3,1fr)!important}.summarycards>div{font-size:9.4pt!important;min-height:0!important;padding:4mm!important}.summaryIcon{display:none!important}.rsec{padding:6mm!important;margin-top:4mm!important;break-inside:auto}.rsec h2{font-size:16pt!important}.scoregrid{grid-template-columns:repeat(3,1fr)!important}.scorecard{min-height:0!important;padding:4mm!important;break-inside:avoid}.scorehead{grid-template-columns:1fr auto!important}.scoreIcon{display:none!important}.scorevalue{font-size:17pt!important}.scorereason,.front p,.prio p,.phase li,.item p,.j p{font-size:9.2pt!important;line-height:1.4!important}.connectionsGrid{grid-template-columns:1fr 1fr!important}.journey{grid-template-columns:repeat(3,1fr)!important}.journey:before{display:none!important}.j{min-height:0!important;break-inside:avoid}.journeyIcon{width:9mm;height:9mm}.grid2{grid-template-columns:1fr 1fr!important}.prioritiesGrid,.timeline{grid-template-columns:repeat(3,1fr)!important}.front,.prio,.phase,.item{break-inside:avoid}.lockednotice{font-size:8.5pt!important}.report{display:block!important}.wizard,.hero,.processing{display:none!important}}
`;
function scoreTone(n){n=Number(n)||0;return n<4?'critical':n<6?'attention':n<8?'good':'strong'}
function scoreColor(n){return scoreTone(n)==='critical'?'#B42318':scoreTone(n)==='attention'?'#D9821B':scoreTone(n)==='strong'?'#067A55':'#0066FF'}
function iconFor(name){name=(name||'').toLowerCase();if(name.includes('clareza')||name.includes('oferta'))return'◎';if(name.includes('conteúdo')||name.includes('conteudo'))return'▤';if(name.includes('prova')||name.includes('autoridade'))return'★';if(name.includes('presença')||name.includes('presenca')||name.includes('descoberta'))return'⌕';if(name.includes('captação')||name.includes('captacao')||name.includes('convers'))return'↗';if(name.includes('tangib'))return'◆';return'•'}
function enhance(win){
 const d=win.document;if(!d||!d.head)return;
 if(!d.getElementById('ym-final-patch')){const s=d.createElement('style');s.id='ym-final-patch';s.textContent=CSS;d.head.appendChild(s)}
 const hero=d.querySelector('.reporthero');if(!hero||hero.dataset.finalized)return;hero.dataset.finalized='1';syncCrm();
 try{d.title='Raio-X Digital | YM Marketing & Negócios';const tag=d.querySelector('.tag');if(tag)tag.textContent='Raio-X Digital'}catch(e){}
 const lead=hero.querySelector('.leadgrid>div:first-child');
 function applyCompany(company){company=String(company||'').trim();if(!lead||!company||lead.querySelector('.companyKicker'))return;const old=lead.querySelector('.eyebrow');if(old)old.remove();const k=d.createElement('div');k.className='companyKicker';k.textContent='Raio-X Digital de '+company.toUpperCase();const r=d.createElement('div');r.className='readyLine';r.textContent='Sua análise está pronta';lead.prepend(r);lead.prepend(k)}
 let company='';try{company=String(win.eval('state.business_name')||'').trim()}catch(e){}try{if(!company){const q=new URLSearchParams(location.search),ref=q.get('ref');for(const key of ['ym_rx_v2_'+ref,'ym_rx_v22_'+ref]){const raw=win.localStorage.getItem(key);if(raw){company=(JSON.parse(raw).business_name||'').trim();if(company)break}}}}catch(e){}applyCompany(company);
 if(!company){try{const q=new URLSearchParams(location.search),ref=q.get('ref');if(ref)fetch('https://ym-raiox-backend.vercel.app/api/raiox/rascunho-v2?ref='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>applyCompany(x?.draft?.business_name||x?.report?.business_name||'')).catch(()=>{})}catch(e){}}
 const overall=hero.querySelector('.overall');if(overall&&!overall.dataset.ring){const strong=overall.querySelector('strong');const val=parseFloat((strong?.textContent||'0').replace(',','.'))||0;const band=overall.querySelector('.band')?.textContent||'';overall.dataset.ring='1';overall.style.setProperty('--tone',scoreColor(val));overall.style.setProperty('--pct',Math.max(0,Math.min(100,val*10)));overall.innerHTML='<div class="overallTitle">Score geral da jornada</div><div class="ring"><div class="ringInner"><strong>'+val.toFixed(1).replace('.',',')+'</strong><span class="den">/10</span></div></div><div class="overallBand">'+band+'</div>'}
 d.querySelectorAll('.summarycards>div').forEach((el,i)=>{if(el.querySelector('.summaryIcon'))return;const x=d.createElement('span');x.className='summaryIcon';x.textContent=i===0?'✓':i===1?'!':'◎';el.prepend(x)});
 d.querySelectorAll('.scorecard').forEach(card=>{const v=parseFloat((card.querySelector('.scorevalue')?.textContent||'0').replace(',','.'))||0;card.dataset.tone=scoreTone(v);const head=card.querySelector('.scorehead');if(head&&!head.querySelector('.scoreIcon')){const i=d.createElement('span');i.className='scoreIcon';i.textContent=iconFor(head.querySelector('h3')?.textContent);head.prepend(i)}});
 const legend=d.querySelector('.scorelegend');if(legend&&!legend.dataset.color){legend.dataset.color='1';legend.innerHTML='<span><i class="legendDot red"></i>0–3,9 crítico</span><span><i class="legendDot amber"></i>4–5,9 atenção</span><span><i class="legendDot blue"></i>6–7,9 bom</span><span><i class="legendDot green"></i>8–10 forte</span><span>O score geral consolida os seis indicadores.</span>'}
 const sections=[...d.querySelectorAll('.rsec')];sections.forEach(sec=>{const h=sec.querySelector('h2');if(!h)return;const t=h.textContent.trim().toLowerCase();if(!h.dataset.icon){h.dataset.icon='1';const i=d.createElement('span');i.className='sectionIcon';i.textContent=t.includes('jornada')?'→':t.includes('achados')?'◆':t.includes('priorizar')?'◎':t.includes('90')?'↗':t.includes('frentes')?'▦':t.includes('levou')?'⇄':t.includes('saúde')||t.includes('saude')?'▥':'i';h.prepend(i)}if(t.includes('levou'))wrapItems(sec,'connectionsGrid');if(t.includes('achados'))wrapItems(sec,'findingsGrid');if(t.includes('priorizar')){const g=sec.querySelector('.grid2');if(g)g.classList.add('prioritiesGrid')}if(t.includes('principal agora'))sec.classList.add('closingDark')});
 d.querySelectorAll('.j').forEach(j=>{if(j.querySelector('.journeyIcon'))return;const i=d.createElement('span');i.className='journeyIcon';const st=j.querySelector('b')?.textContent||'';i.textContent=st==='Encontrar'?'⌕':st==='Entender'?'◉':st==='Confiar'?'✓':st==='Contatar'?'↗':st==='Comprar'?'◆':'↻';j.prepend(i)});
 const ps=[...d.querySelectorAll('.prioritiesGrid .prio')];ps.forEach((p,i)=>{if(p.querySelector('.priorityNum'))return;const n=d.createElement('div');n.className='priorityNum';n.textContent='0'+(i+1);p.prepend(n)});
 d.querySelectorAll('.timeline .phase').forEach((p,i)=>{if(p.querySelector('.phaseNum'))return;const n=d.createElement('div');n.className='phaseNum';n.textContent=['30','60','90'][i]||'';p.prepend(n)});
}

async function syncCrm(){
 if(!ref)return;
 const once='ym_rx_crm_synced_'+ref;
 try{if(sessionStorage.getItem(once)==='1')return}catch(e){}
 try{
   const rr=await fetch('https://ym-raiox-backend.vercel.app/api/raiox/rascunho-v2?ref='+encodeURIComponent(ref),{cache:'no-store'});
   if(!rr.ok)return;
   const data=await rr.json();
   if(!data?.report)return;
   let local={};try{local=JSON.parse(frame.contentWindow.localStorage.getItem('ym_rx_v22_'+ref)||'{}')}catch(e){}
   const draft={...local,...(data.draft||{})},report=data.report;
   const answers={};
   for(let i=1;i<=18;i++){
     const id='Q'+String(i).padStart(2,'0');
     const v=draft.answers?.[id];
     answers[id]=Array.isArray(v)?v.join(' | '):String(v??'').trim();
   }
   if(draft.q06main&&answers.Q06)answers.Q06+=' | Principal origem de clientes: '+draft.q06main;
   const overall=Number(report?.score_panel?.overall_score);
   if(!Number.isFinite(overall))return;
   const packet={
     source_product:'RAIO_X_DIGITAL',source_system:'ym_raiox_oficial',source_session_id:ref,
     client_ref:draft.business_name||null,
     packet_version:'VOS_INTAKE_2.0',questionnaire_version:'RX_CANONICO_2.0',scoring_version:'RX_SCORE_2.2',report_version:'RX_REPORT_2.2',
     business_name:String(draft.business_name||'').trim(),payer:{name:String(draft.contact_name||'').trim(),email:String(draft.contact_email||'').trim(),phone:String(draft.contact_whatsapp||'').replace(/\D/g,'')},answers,
     complements:draft.complements||{},links:draft.links||[],
     score:{overall,status:'FINAL',coverage_pct:100},
     report,route_signal:null,human_validation_required:true,completed_at:new Date().toISOString()
   };
   const r=await fetch('https://srzdikgztpdtwbggwniz.supabase.co/functions/v1/save-raiox-intake',{
     method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref,packet})
   });
   if(r.ok){try{sessionStorage.setItem(once,'1')}catch(e){};console.info('[YM Raio-X] CRM sincronizado.');}
   else console.warn('[YM Raio-X] CRM sync pendente:',r.status);
 }catch(e){console.warn('[YM Raio-X] CRM sync será tentado novamente no próximo acesso.');}
}
function wrapItems(sec,cls){if(sec.querySelector('.'+cls))return;const items=[...sec.children].filter(x=>x.classList&&x.classList.contains('item'));if(!items.length)return;const w=sec.ownerDocument.createElement('div');w.className=cls;items[0].before(w);items.forEach(x=>w.appendChild(x))}
frame.addEventListener('load',()=>{let win;try{win=frame.contentWindow}catch(e){return}const run=()=>{try{enhance(win)}catch(e){console.error(e)}};run();const mo=new MutationObserver(()=>setTimeout(run,20));mo.observe(win.document.documentElement,{childList:true,subtree:true});});
})();
</script>
</body>
