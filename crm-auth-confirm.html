<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validando acesso — CRM Essencial YM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f7f9fc;color:#0a2540;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{width:min(480px,100%);background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:30px;box-shadow:0 18px 50px rgba(10,37,64,.08)}.brand{font-weight:800;letter-spacing:.08em;font-size:12px;color:#0066ff}.title{font-size:27px;font-weight:800;margin:10px 0 12px}.text{color:#6b7a99;line-height:1.6}.err{color:#b91c1c}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#0066ff;margin-right:8px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>
<div class="card"><div class="brand">YM · CRM ESSENCIAL</div><div class="title">Validando seu acesso</div><p id="status" class="text"><span class="dot"></span>Confirmando o link seguro…</p></div>
<script>
const SUPABASE_URL='https://nxmcqkhaolplyzapccaf.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_z7XBvN1Yxao3yooH3dV5Bg_I2tBojp5';
const sb=window.supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
(async()=>{
  const status=document.getElementById('status');
  const q=new URLSearchParams(location.search);const tokenHash=q.get('token_hash');
  if(!tokenHash){status.className='text err';status.textContent='Link inválido. Solicite um novo acesso ao CRM.';return;}
  const {error}=await sb.auth.verifyOtp({token_hash:tokenHash,type:'email'});
  history.replaceState({},document.title,location.pathname);
  if(error){status.className='text err';status.textContent='Este link expirou, já foi utilizado ou não pôde ser validado. Solicite um novo acesso.';return;}
  status.textContent='Acesso confirmado. Abrindo o CRM Essencial YM…';
  setTimeout(()=>location.replace('crm-vos.html'),350);
})();
</script>
</body>
</html>
