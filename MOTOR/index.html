<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>MOTOR VOS — YM Marketing & Negócios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/internal-shell.css">
<style>
.motor-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}.case-index{position:sticky;top:82px;background:#fff;border:1px solid var(--ym-line);border-radius:16px;box-shadow:var(--ym-shadow);overflow:hidden}.case-index h2{font:800 13px Montserrat;color:var(--ym-navy);margin:0;padding:14px 15px;background:#F2F6FB;border-bottom:1px solid var(--ym-line)}.case-search{padding:10px;border-bottom:1px solid var(--ym-line)}.case-items{max-height:calc(100vh - 230px);overflow:auto}.case-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #EDF2F6;background:#fff;padding:11px 13px;cursor:pointer}.case-item:hover{background:#F7FAFE}.case-item.active{background:#EEF3FF;border-left:4px solid var(--ym-indigo)}.case-item b{display:block;font-size:11px;color:var(--ym-navy)}.case-item span{display:block;font-size:9px;color:var(--ym-muted);margin-top:3px}.workspace{min-width:0}.case-hero{background:linear-gradient(135deg,#0A2540,#174C78 72%,#484DCF);color:#fff;border-radius:20px;padding:20px 22px;box-shadow:var(--ym-shadow)}.case-hero h2{font:800 24px Montserrat;margin:5px 0}.case-hero p{font-size:11px;color:#C9D9E8;margin:0}.case-hero .ym-badge{margin-top:10px}.motor-section{border-radius:16px;margin-top:12px;overflow:hidden;border:1px solid var(--ym-line);box-shadow:0 8px 24px rgba(15,42,67,.05)}.motor-section>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px}.motor-section>header h3{font:800 13px Montserrat;margin:0}.motor-section .body{padding:14px 15px}.sec-destination{background:#F4F8FF;border-color:#D8E7FF}.sec-p8{background:#F5F5FF;border-color:#E0E2FF}.sec-evidence{background:#F1FAFB;border-color:#D6EEF0}.sec-hyp{background:#FFF8EA;border-color:#F1DEB5}.sec-conclusion{background:#F7F0FF;border-color:#E7D6FA}.sec-gate{background:#FFF9ED;border-color:#F1DFBA}.sec-order{background:#ECF4FF;border-color:#D1E2FA}.p8s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.p8-card{background:rgba(255,255,255,.82);border:1px solid #DDE2F6;border-radius:12px;padding:12px}.p8-card h4{font:800 11px Montserrat;margin:0;color:var(--ym-navy)}.p8-top{display:flex;justify-content:space-between;gap:8px}.entry{background:rgba(255,255,255,.8);border:1px solid var(--ym-line);border-radius:11px;padding:11px;margin-top:8px}.entry h4{font-size:11px;color:var(--ym-navy);margin:0 0 5px}.entry p{font-size:10.5px;line-height:1.5;color:#496176;margin:4px 0}.gate-box{padding:12px;border-left:4px solid var(--ym-warn);background:rgba(255,255,255,.75);border-radius:10px;font-size:11px;line-height:1.55}.gate-box.ok{border-color:var(--ym-ok);background:#F2FBF7}.order-item{display:grid;grid-template-columns:36px 1fr;gap:10px}.seq{width:32px;height:32px;border-radius:9px;background:var(--ym-navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}.locked{padding:25px;text-align:center;border:1px dashed #C8D6E5;border-radius:12px;color:var(--ym-muted);font-size:11px;background:rgba(255,255,255,.65)}
@media(max-width:1050px){.motor-grid{grid-template-columns:1fr}.case-index{position:relative;top:auto}.case-items{max-height:250px}.p8s{grid-template-columns:1fr}}
</style></head><body>
<div class="ym-main"><header class="ym-topbar"><div style="display:flex;align-items:center;gap:10px"><button id="ymMenu" class="ym-mobile-toggle">☰</button><div class="ym-topbar-title">MOTOR VOS</div></div><div class="ym-topbar-meta"><span class="ym-chip stage">STAGING · CANDIDATO FINAL</span><span class="ym-chip">VER → GATE → ORDENAR</span></div></header>
<main class="ym-content"><div class="ym-header"><div><div class="ym-eyebrow">MOTOR WEB VOS</div><h1 class="ym-title">Análise e ordenação</h1><p class="ym-lead">Dados do Raio-X, evidências e hipóteses organizados visualmente para decisão humana.</p></div><div class="ym-actions"><a class="ym-btn secondary" href="/CRM">Voltar ao CRM</a><button id="refresh" class="ym-btn secondary">Atualizar</button></div></div>
<div class="motor-grid"><aside class="case-index"><h2>Casos</h2><div class="case-search"><input id="caseSearch" class="ym-input" placeholder="Buscar caso..."></div><div id="caseItems" class="case-items"></div></aside><section id="workspace" class="workspace"><div class="ym-empty">Selecione um caso para abrir o VER.</div></section></div>
</main></div><script src="/assets/internal-shell.js"></script><script>
let dash=null,bundle=null,currentId=null;const $=id=>document.getElementById(id),S=YM.esc;
async function authFetch(path,method='GET',body){const s=await YM.requireSession('/MOTOR'+location.search);if(!s)throw new Error('Sessão necessária');const r=await fetch(YM.SUPABASE_URL+'/functions/v1/'+path,{method,headers:{Authorization:'Bearer '+s.access_token,apikey:YM.PUBLISHABLE_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'Falha no MOTOR');return j}
async function loadDashboard(first=false){dash=await authFetch('motor-dashboard');if(first)YM.shell('MOTOR',dash.user);renderCases();const wanted=new URLSearchParams(location.search).get('case');if(wanted&&!currentId)await openCase(wanted)}
function renderCases(){const q=$('caseSearch').value.trim().toLowerCase(),items=(dash.cases||[]).filter(x=>!q||[x.business_name,x.client_ref,x.status].join(' ').toLowerCase().includes(q));$('caseItems').innerHTML=items.length?items.map(x=>`<button class="case-item ${x.id===currentId?'active':''}" onclick="openCase('${x.id}')"><b>${S(x.business_name||x.client_ref||'Caso VOS')}</b><span>${S(x.status)} · ${YM.datePt(x.updated_at)}</span></button>`).join(''):'<div class="ym-empty">Nenhum caso.</div>'}
async function openCase(id){try{currentId=id;const j=await authFetch('motor-case-bundle','POST',{case_id:id});bundle=j.bundle||{};history.replaceState({},'',location.pathname+'?case='+encodeURIComponent(id));renderCases();renderWorkspace()}catch(e){YM.toast(e.message,true)}}window.openCase=openCase;
function opts(arr,v){return arr.map(x=>`<option value="${x}" ${x===v?'selected':''}>${S(x||'Selecione')}</option>`).join('')}const CLASS=['','ATIVO','DISFUNCAO','LACUNA','INCONCLUSIVO'],CONF=['','ALTA','MEDIA','BAIXA','SEM_BASE'];
function p8Card(p){const c=p.p8_code;return `<div class="p8-card"><div class="p8-top"><div><h4>${S(p.p8_label||c)}</h4><div class="ym-meta">${S(c)}</div></div><span class="ym-badge ${p.human_status==='VALIDADO'?'ok':'muted'}">${S(p.human_status||'PENDENTE')}</span></div><label class="ym-label">Observação</label><textarea id="po_${c}" class="ym-textarea">${S(p.observation||'')}</textarea><label class="ym-label">Evidência</label><textarea id="pe_${c}" class="ym-textarea">${S(p.evidence_summary||'')}</textarea><div class="ym-formgrid"><div><label class="ym-label">Classificação</label><select id="pc_${c}" class="ym-select">${opts(CLASS,p.classification||'')}</select></div><div><label class="ym-label">Confiança</label><select id="pf_${c}" class="ym-select">${opts(CONF,p.confidence||'')}</select></div></div><label class="ym-label">Validação restante</label><textarea id="pr_${c}" class="ym-textarea">${S(p.remaining_validation||'')}</textarea><label class="ym-label">Justificativa humana</label><input id="pj_${c}" class="ym-input"><div class="ym-actions" style="margin-top:7px"><button class="ym-btn secondary" onclick="saveP8('${c}',false)">Salvar rascunho</button><button class="ym-btn ok" onclick="saveP8('${c}',true)">Validar P</button></div></div>`}
function entries(items){return items.length?items.map(e=>`<div class="entry"><div class="ym-meta">${S(e.ver_field||e.evidence_type||e.conclusion_type||'')} · ${S(e.p8_code||'GERAL')} · ${S(e.human_status||e.reliability||e.confidence||'')}</div><h4>${S(e.title||e.statement||'Registro')}</h4><p>${S(e.content||e.statement||'')}</p>${e.source_ref?`<div class="ym-meta">Origem: ${S(e.source_ref)}</div>`:''}</div>`).join(''):'<div class="ym-empty">Nenhum registro.</div>'}
function hyps(items){return items.length?items.map(h=>`<div class="entry"><div class="ym-meta">${S(h.p8_code||'GERAL')} · ${S(h.status)} · confiança ${S(h.confidence||'—')}</div><h4>${S(h.statement)}</h4>${(h.tests||[]).map(t=>`<div class="ym-block amber" style="padding:8px;margin-top:7px"><div class="ym-meta"><b>Teste</b> · ${S(t.result_classification||'PENDENTE')}</div><div class="ym-copy">${S(t.test_description)}${t.result_summary?'<br><b>Resultado:</b> '+S(t.result_summary):''}</div></div>`).join('')}${(h.tests||[]).some(t=>t.result_classification)?`<div class="ym-formgrid" style="margin-top:8px"><div><label class="ym-label">Decisão humana</label><select id="hs_${h.id}" class="ym-select"><option>VALIDADA</option><option>REJEITADA</option><option>INCONCLUSIVA</option></select></div><div><label class="ym-label">Confiança</label><select id="hc_${h.id}" class="ym-select">${opts(CONF,h.confidence||'')}</select></div><div class="ym-wide"><label class="ym-label">Justificativa</label><input id="hr_${h.id}" class="ym-input"></div></div><button class="ym-btn secondary" style="margin-top:7px" onclick="validateHyp('${h.id}')">Registrar decisão</button>`:''}</div>`).join(''):'<div class="ym-empty">Nenhuma hipótese.</div>'}
function orders(items){return items.length?[...items].sort((a,b)=>(a.sequence_order||999)-(b.sequence_order||999)).map(o=>`<div class="entry order-item"><div>${o.human_status==='VALIDADO'&&!o.not_now?`<span class="seq">${S(o.sequence_order)}</span>`:`<span class="ym-badge ${o.not_now?'warn':'muted'}">${o.not_now?'NÃO AGORA':S(o.human_status)}</span>`}</div><div><h4>${S(o.action)}</h4><p>${S(o.rationale)}</p>${o.human_status==='PENDENTE'?`<div class="ym-formgrid"><div><label class="ym-label">Sequência</label><input id="os_${o.id}" type="number" min="1" class="ym-input" ${o.not_now?'disabled':''}></div><div><label class="ym-label">Justificativa</label><input id="or_${o.id}" class="ym-input"></div></div><div class="ym-actions" style="margin-top:7px"><button class="ym-btn ok" onclick="validateOrder('${o.id}',${o.not_now})">Validar</button><button class="ym-btn danger" onclick="rejectOrder('${o.id}')">Rejeitar</button></div>`:''}</div></div>`).join(''):'<div class="ym-empty">Nenhuma ação candidata.</div>'}
function renderWorkspace(){const b=bundle,c=b.case||{},p8=b.p8_coverage||[],g=(b.gates||[])[0]||{},gateOk=g.status==='APROVADO',valid=p8.filter(x=>x.human_status==='VALIDADO').length;const w=$('workspace');w.innerHTML=`<div class="case-hero"><div class="ym-eyebrow" style="color:#BFD2FF">VOS_CASE_1.0</div><h2>${S(c.business_name||c.client_ref||'Caso VOS')}</h2><p>${S(c.client_name||'')} · ${S(c.status||'')}</p><span class="ym-badge ${gateOk?'ok':'warn'}">VER_GATE · ${S(g.status||'PENDENTE')}</span></div><section class="motor-section sec-destination"><header><h3>1 · Destino</h3><span class="ym-badge indigo">HUMANO</span></header><div class="body"><div class="ym-formgrid"><div><label class="ym-label">Destino de curto prazo</label><textarea id="dest" class="ym-textarea">${S(c.destination_short_term||'')}</textarea></div><div><label class="ym-label">Sinal de melhora</label><textarea id="signal" class="ym-textarea">${S(c.destination_success_signal||'')}</textarea></div></div><button class="ym-btn secondary" style="margin-top:8px" onclick="saveDestination()">Salvar destino</button></div></section><section class="motor-section sec-p8"><header><h3>2 · Cobertura dos 8Ps</h3><span class="ym-badge ${valid===8?'ok':'indigo'}">${valid}/8 validados</span></header><div class="body"><div class="p8s">${p8.map(p8Card).join('')}</div></div></section><section class="motor-section sec-evidence"><header><h3>3 · Evidências e mapa VER</h3><span class="ym-badge muted">${(b.evidence||[]).length} evidências</span></header><div class="body"><h4 style="font:800 11px Montserrat;color:var(--ym-navy)">Evidências</h4>${entries(b.evidence||[])}<h4 style="font:800 11px Montserrat;color:var(--ym-navy);margin-top:14px">Leituras VER</h4>${entries(b.ver_entries||[])}</div></section><section class="motor-section sec-hyp"><header><h3>4 · Hipóteses e testes</h3><span class="ym-badge warn">${(b.hypotheses||[]).length} hipóteses</span></header><div class="body">${hyps(b.hypotheses||[])}</div></section><section class="motor-section sec-conclusion"><header><h3>5 · Conclusões humanas</h3><span class="ym-badge indigo">${(b.conclusions||[]).length} registradas</span></header><div class="body">${entries(b.conclusions||[])}<div class="ym-formgrid" style="margin-top:10px"><div><label class="ym-label">Tipo</label><select id="ct" class="ym-select"><option>OUTRA</option><option>CAUSA_PROVAVEL</option><option>CAUSA_VALIDADA</option></select></div><div><label class="ym-label">Confiança</label><select id="cc" class="ym-select">${opts(CONF,'')}</select></div><div class="ym-wide"><label class="ym-label">Conclusão</label><textarea id="cs" class="ym-textarea"></textarea></div><div class="ym-wide"><label class="ym-label">Justificativa humana</label><textarea id="cj" class="ym-textarea"></textarea></div></div><button class="ym-btn secondary" style="margin-top:8px" onclick="addConclusion()">Registrar conclusão</button></div></section><section class="motor-section sec-gate"><header><h3>6 · Gate VER</h3><span class="ym-badge ${gateOk?'ok':'warn'}">${S(g.status||'PENDENTE')}</span></header><div class="body"><div class="gate-box ${gateOk?'ok':''}"><b>${valid}/8 Ps validados.</b> O Gate não é aprovado por Score ou IA. A decisão exige justificativa humana.</div><label class="ym-label">Justificativa do Gate</label><textarea id="gj" class="ym-textarea">${S(g.justification||'')}</textarea><label class="ym-label">Ressalvas / condições restantes</label><textarea id="gr" class="ym-textarea">${S(g.remaining_conditions||'')}</textarea><div class="ym-actions" style="margin-top:8px"><button class="ym-btn ok" ${valid!==8?'disabled':''} onclick="setGate('APROVADO')">Aprovar Gate</button><button class="ym-btn danger" onclick="setGate('REPROVADO')">Manter / reprovar</button></div></div></section><section class="motor-section sec-order"><header><h3>7 · ORDENAR</h3><span class="ym-badge ${gateOk?'ok':'warn'}">${gateOk?'LIBERADO':'BLOQUEADO'}</span></header><div class="body">${gateOk?`${orders(b.order_candidates||[])}<div class="ym-block blue" style="margin-top:10px"><h3>Nova ação candidata</h3><label class="ym-label">Ação</label><textarea id="oa" class="ym-textarea"></textarea><label class="ym-label">Racional</label><textarea id="orr" class="ym-textarea"></textarea><label class="ym-label">Impacto no destino</label><textarea id="oi" class="ym-textarea"></textarea><label style="display:flex;gap:7px;align-items:center;font-size:10px;margin-top:8px"><input id="on" type="checkbox"> Registrar como “não agora”</label><button class="ym-btn" style="margin-top:8px" onclick="createOrder()">Criar ação pendente</button></div>`:`<div class="locked"><b>ORDENAR bloqueado.</b><br>O VER_GATE precisa ser aprovado por uma pessoa identificada.</div>`}</div></section>`}
async function ver(payload,msg){try{await authFetch('motor-ver-actions','POST',{case_id:currentId,...payload});YM.toast(msg);await openCase(currentId);await loadDashboard()}catch(e){YM.toast(e.message,true)}}async function ord(payload,msg){try{await authFetch('motor-order-actions','POST',{case_id:currentId,...payload});YM.toast(msg);await openCase(currentId);await loadDashboard()}catch(e){YM.toast(e.message,true)}}
window.saveDestination=()=>ver({action:'UPDATE_DESTINATION',destination_short_term:$('dest').value,destination_success_signal:$('signal').value},'Destino atualizado.');window.saveP8=(c,v)=>ver({action:'UPDATE_P8',p8_code:c,observation:$('po_'+c).value,evidence_summary:$('pe_'+c).value,classification:$('pc_'+c).value||null,confidence:$('pf_'+c).value||null,remaining_validation:$('pr_'+c).value,human_status:v?'VALIDADO':'PENDENTE',rationale:$('pj_'+c).value},v?'8P validado por você.':'Rascunho salvo.');window.validateHyp=id=>ver({action:'VALIDATE_HYPOTHESIS',hypothesis_id:id,status:$('hs_'+id).value,confidence:$('hc_'+id).value||null,rationale:$('hr_'+id).value},'Decisão da hipótese registrada.');window.addConclusion=()=>ver({action:'ADD_CONCLUSION',conclusion_type:$('ct').value,confidence:$('cc').value,statement:$('cs').value,rationale:$('cj').value},'Conclusão humana registrada.');window.setGate=s=>ver({action:'SET_VER_GATE',status:s,justification:$('gj').value,remaining_conditions:$('gr').value},'Gate atualizado.');window.createOrder=()=>ord({action:'CREATE_CANDIDATE',candidate_action:$('oa').value,rationale:$('orr').value,impact_on_destination:$('oi').value,not_now:$('on').checked},'Ação candidata criada.');window.validateOrder=(id,n)=>ord({action:'VALIDATE_CANDIDATE',candidate_id:id,sequence_order:n?null:Number($('os_'+id).value),validation_rationale:$('or_'+id).value},'Ação validada e sequenciada.');window.rejectOrder=id=>ord({action:'REJECT_CANDIDATE',candidate_id:id,validation_rationale:$('or_'+id).value},'Ação rejeitada.');$('caseSearch').addEventListener('input',renderCases);$('refresh').onclick=async()=>{await loadDashboard();if(currentId)await openCase(currentId)};(async()=>{const s=await YM.requireSession('/MOTOR'+location.search);if(!s)return;await loadDashboard(true);if(!currentId&&(dash.cases||[]).length)await openCase(dash.cases[0].id)})();
</script></body></html>
