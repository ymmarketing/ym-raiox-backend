<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Técnico — Raio-X v3.1</title>
<style>
html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1c2b40}
#boot{max-width:680px;margin:80px auto;padding:28px;background:#fff;border:1px solid #dde4ee;border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.06)}
#boot h1{font-size:22px;margin:0 0 10px}#boot p{line-height:1.6;color:#4b5e75}.err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<div id="boot"><h1>Carregando o preview técnico do Raio-X v3.1…</h1><p>Este ambiente não cobra e não grava dados reais. Pagamento, aprovação e persistência são simulados apenas para homologação visual/funcional.</p></div>
<script>
(async function(){
  const BASE='https://raw.githubusercontent.com/ymmarketing/ymnegocios/vos-etapa3-integracao-2026-08-08/';
  const FAKE_REF='ym_raiox_1786160000000_previewabcd';
  const here=location.origin+location.pathname;
  try{
    const [htmlR,persistR,shellR]=await Promise.all([
      fetch(BASE+'raio-x.html',{cache:'no-store'}),
      fetch(BASE+'assets/js/raiox-v3.1-persist.js',{cache:'no-store'}),
      fetch(BASE+'assets/js/raiox-payment-shell-v1.js',{cache:'no-store'})
    ]);
    if(!htmlR.ok||!persistR.ok||!shellR.ok) throw new Error('Não foi possível carregar os arquivos da branch.');
    let html=await htmlR.text();
    const persist=await persistR.text();
    const shell=await shellR.text();

    html=html.replace('<script src="assets/js/raiox-v3.1-persist.js"></'+'script>','<script>'+persist.replaceAll('</'+'script>','<\\/script>')+'</'+'script>');
    html=html.replace('<script src="assets/js/raiox-payment-shell-v1.js"></'+'script>','<script>'+shell.replaceAll('</'+'script>','<\\/script>')+'</'+'script>');

    const mock=`<script>
    (function(){
      const realFetch=window.fetch.bind(window);
      const fakeRef='${FAKE_REF}';
      const previewUrl='${here}';
      window.fetch=async function(input,opts){
        const url=String(input);
        if(url.includes('/api/pagamento/criar')) return new Response(JSON.stringify({ok:true,ref:fakeRef,paymentUrl:previewUrl+'?ref='+encodeURIComponent(fakeRef),status:'pending'}),{status:200,headers:{'Content-Type':'application/json'}});
        if(url.includes('/api/pagamento/status')) return new Response(JSON.stringify({status:'approved',ref:fakeRef}),{status:200,headers:{'Content-Type':'application/json'}});
        if(url.includes('/api/acesso/manual')) return new Response(JSON.stringify({ok:true,ref:fakeRef,status:'approved',tipo:'preview'}),{status:200,headers:{'Content-Type':'application/json'}});
        if(url.includes('save-raiox-intake')) return new Response(JSON.stringify({ok:true,intake_id:'PREVIEW-NAO-PERSISTIDO',created_at:new Date().toISOString()}),{status:201,headers:{'Content-Type':'application/json'}});
        return realFetch(input,opts);
      };
    })();
    <\/script>`;
    const banner=`<div style="position:fixed;z-index:99999;left:0;right:0;top:60px;background:#fff3cd;border-bottom:1px solid #f0c36d;color:#7a4b00;text-align:center;padding:7px 12px;font:700 11px Arial,sans-serif;letter-spacing:.04em">PREVIEW TÉCNICO · PAGAMENTO E BANCO SIMULADOS · NENHUMA COBRANÇA REAL</div>`;
    html=html.replace('<body>','<body>'+mock+banner);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<h1>Preview indisponível</h1><p class="err">'+String(e&&e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
