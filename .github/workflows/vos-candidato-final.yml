name: VOS Candidato Final - Guardrails Integrados

on:
  push:
    branches:
      - vos-etapa5-crm-essencial-2026-08-08
    paths:
      - 'MOTOR/**'
      - 'VOS/**'
      - 'CRM/**'
      - 'interno/**'
      - 'Identidade/**'
      - 'quemsomos/**'
      - 'areadocliente/**'
      - 'assets/internal-shell.*'
      - 'vercel.json'
      - 'supabase/functions/motor-request-magic-link/**'
      - 'supabase/functions/motor-dashboard/**'
      - 'supabase/functions/motor-case-bundle/**'
      - 'supabase/functions/create-vos-case/**'
      - 'supabase/functions/motor-ver-actions/**'
      - 'supabase/functions/motor-order-actions/**'
      - 'supabase/functions/motor-crm/**'
      - 'supabase/migrations/20260811130848_add_vos_order_human_sequence_v1.sql'
      - 'supabase/migrations/20260811174542_restore_service_role_crm_dml_v1.sql'
      - 'supabase/migrations/20260811174631_restore_service_role_internal_dml_v2.sql'
      - 'supabase/migrations/20260811174712_restore_service_role_relation_tables_v3.sql'
      - 'supabase/migrations/20260811183000_extend_crm_visual_profile_v1.sql'
      - 'testes/candidato-final-guardrails.mjs'
      - '.github/workflows/vos-candidato-final.yml'
  pull_request:
    paths:
      - 'MOTOR/**'
      - 'CRM/**'
      - 'interno/**'
      - 'assets/internal-shell.*'
      - 'vercel.json'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'testes/candidato-final-guardrails.mjs'

jobs:
  candidato-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guardrails do Motor VOS
        run: node testes/motor-vos-guardrails.mjs
      - name: Guardrails do CRM Essencial
        run: node testes/crm-essencial-guardrails.mjs
      - name: Guardrails integrados do candidato final
        run: node testes/candidato-final-guardrails.mjs
