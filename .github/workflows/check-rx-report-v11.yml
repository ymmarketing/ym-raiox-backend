name: Check RX_REPORT_1.1
on:
  push:
    branches:
      - feat/rx-report-1-1-interpretativo-20260819
    paths:
      - '.github/workflows/check-rx-report-v11.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe e imports
        run: |
          node --check lib/raiox-report-v1-1.js
          node --check api/raiox/interpretar.js
          node -e "import('./lib/raiox-report-v1-1.js').then(m=>{if(m.REPORT_VERSION!=='RX_REPORT_1.1')process.exit(2);console.log(m.REPORT_VERSION)})"
          node -e "import('./api/raiox/interpretar.js').then(m=>{if(typeof m.default!=='function')process.exit(2);console.log('endpoint import OK')})"
      - name: Validar guardrails estruturais
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('lib/raiox-report-v1-1.js').read_text(encoding='utf-8')
          required=[
            'CLIENTE FORNECE DADOS → RAIO-X DEVOLVE SIGNIFICADO',
            'Nunca copie uma resposta aberta como texto final',
            'Transforme RX29 em DESTINO ESTRATÉGICO',
            'cross_readings',
            'not_to_decide',
            'route_to_validate',
            'hasLongCopiedSpan',
          ]
          for x in required: assert x in s, x
          print('guardrails estruturais OK')
          PY
      - name: Registrar check
        run: |
          mkdir -p docs
          printf '%s\n' '# RX_REPORT_1.1 — BACKEND CHECK OK' '' '- sintaxe validada' '- endpoint protegido importado' '- guardrail anti-copy presente' '- guardrails de escopo presentes' > docs/RX_REPORT_1_1_BACKEND_CHECK_OK.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RX_REPORT_1_1_BACKEND_CHECK_OK.md
          git diff --cached --quiet && exit 0
          git commit -m 'Raio-X backend: valida RX_REPORT_1.1'
          git push
