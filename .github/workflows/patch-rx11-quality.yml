name: Finalize RX_REPORT_1.1 branch
on:
  push:
    branches:
      - feat/rx-report-1-1-interpretativo-20260819
    paths:
      - '.github/workflows/patch-rx11-quality.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos finais
        run: |
          node --check lib/raiox-report-v1-1.js
          node --check api/raiox/interpretar.js
          grep -q 'RX27 é PERCEPÇÃO DO CLIENTE' lib/raiox-report-v1-1.js
          grep -q 'Nunca copie uma resposta aberta como texto final' lib/raiox-report-v1-1.js
      - name: Remover artefatos temporários de desenvolvimento
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/check-rx-report-v11.yml .github/workflows/patch-rx11-quality.yml docs/RX_REPORT_1_1_BACKEND_CHECK_OK.md
          git commit -m 'chore: remove artefatos temporários do RX_REPORT_1.1'
          git push
