<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Definir senha — YM</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/internal-shell.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#eef3f9,#eef0ff)}.box{width:min(500px,100%);background:#fff;border:1px solid var(--ym-line);border-radius:22px;padding:34px;box-shadow:var(--ym-shadow)}.box img{width:170px;margin-bottom:24px}.box h1{font:800 27px Montserrat;color:var(--ym-navy);margin:6px 0}.box p{font-size:12px;line-height:1.6;color:var(--ym-muted)}.msg{display:none;padding:10px 12px;border-radius:9px;font-size:11px;margin:12px 0;background:#eef6ff;color:#245e9d}.msg.err{background:#fff1f0;color:#b42318}</style></head><body><div class="box"><img src="https://ymnegocios.com.br/assets/img/logo-ym-horizontal.webp" alt="YM"><div class="ym-eyebrow">Área interna</div><h1>Definir sua senha</h1><p id="intro">Crie a senha que será usada para entrar no CRM, MOTOR e Identidade. Você fará login uma única vez para os três módulos.</p><div id="msg" class="msg"></div><div id="form" class="ym-hidden"><label class="ym-label">Nova senha</label><input id="p1" class="ym-input" type="password" autocomplete="new-password"><label class="ym-label">Confirme a senha</label><input id="p2" class="ym-input" type="password" autocomplete="new-password"><p style="font-size:10px">Use pelo menos 8 caracteres.</p><button id="save" class="ym-btn" style="width:100%;margin-top:8px">Salvar senha e entrar</button></div></div><script src="/assets/internal-shell.js"></script><script>const q=new URLSearchParams(location.search),token=q.get('token_hash'),change=q.get('change')==='1',next=YM.safeNext(q.get('next')||'/CRM'),msg=document.getElementById('msg'),form=document.getElementById('form');function show(t,e=false){msg.textContent=t;msg.className='msg'+(e?' err':'');msg.style.display='block'}async function boot(){if(token){const {error}=await YM.sb.auth.verifyOtp({token_hash:token,type:'recovery'});history.replaceState({},document.title,location.pathname+'?next='+encodeURIComponent(next));if(error)return show('Este link expirou ou já foi usado. Volte ao login e solicite outro.',true);form.classList.remove('ym-hidden');show('Link validado. Agora defina sua senha.');return}const {data:{session}}=await YM.sb.auth.getSession();if(change&&session){document.getElementById('intro').textContent='Altere sua senha. A sessão continuará compartilhada entre os módulos.';form.classList.remove('ym-hidden');return}if(session){location.replace(next);return}show('Abra o link de definição de senha recebido por e-mail ou solicite um novo no login.',true)}async function save(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8)return show('A senha precisa ter pelo menos 8 caracteres.',true);if(p1!==p2)return show('As duas senhas precisam ser iguais.',true);const b=document.getElementById('save');b.disabled=true;b.textContent='Salvando…';const {error}=await YM.sb.auth.updateUser({password:p1});b.disabled=false;b.textContent='Salvar senha e entrar';if(error)return show('Não foi possível salvar a senha. Solicite um novo link e tente novamente.',true);show('Senha salva. Abrindo a área interna…');setTimeout(()=>location.replace(next),500)}document.getElementById('save').onclick=save;boot();</script></body></html>
